```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 6. Verify toolchain
      - name: Verify Android environment
        run: |
          java -version
          node --version
          npm --version
          adb version
          sdkmanager --version

      # 7. Create environment file
      - name: Create mobile .env
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          STRIPE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_API_BASE_URL=${API_BASE_URL}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_KEY}
          EOF

      # 8. Validate required secrets
      - name: Validate secrets
        env:
          API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          STRIPE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::EXPO_PUBLIC_API_BASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$STRIPE_KEY" ]; then
            echo "::error::EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY secret is missing"
            exit 1
          fi

          echo "Required secrets are configured."

      # 9. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 10. Expo doctor
      - name: Check Expo project
        working-directory: apps/mobile
        run: npx expo-doctor

      # 11. Generate Android project
      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      # 12. Fix Gradle executable permission
      - name: Make Gradle executable
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      # 13. Clean Gradle
      - name: Clean Android build
        working-directory: apps/mobile/android
        run: ./gradlew clean --no-daemon

      # 14. Build release APK
      - name: Build Release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 15. Verify APK exists
      - name: Verify APK
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: luxora-stay-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
```

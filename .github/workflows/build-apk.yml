name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Production Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      # 3. Verify environment
      - name: Flutter environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # 4. Android Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 6. Get dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7. Code generation if required
      - name: Generate code
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner dependency found. Skipping code generation."
          fi

      # 8. Analyze
      - name: Flutter analyze
        run: flutter analyze

      # 9. Tests
      - name: Flutter tests
        run: flutter test

      # 10. Clean previous builds
      - name: Flutter clean
        run: flutter clean

      # 11. Get dependencies again after clean
      - name: Flutter pub get after clean
        run: flutter pub get

      # 12. Build production APK
      - name: Build Release APK
        run: flutter build apk --release

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 14. Rename production APK
      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            release/Luxora-Stay-release.apk

      # 15. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Luxora-Stay-Release-APK
          path: release/Luxora-Stay-release.apk
          if-no-files-found: error
          retention-days: 30

name: Luxora Stay - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Flutter 3.41.0
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
          cache: true

      # --------------------------------------------------
      # 4. Verify environment
      # --------------------------------------------------
      - name: Verify Flutter and Java
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      # --------------------------------------------------
      # 5. Create asset directories
      # --------------------------------------------------
      - name: Create required asset directories
        run: |
          mkdir -p assets/images
          mkdir -p assets/icons
          mkdir -p assets/animations
          mkdir -p assets/vectors

      # --------------------------------------------------
      # 6. Flutter clean
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean

      # --------------------------------------------------
      # 7. Get dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # --------------------------------------------------
      # 8. Check outdated packages
      # Informational only - never fails build
      # --------------------------------------------------
      - name: Check outdated packages
        continue-on-error: true
        run: flutter pub outdated

      # --------------------------------------------------
      # 9. Analyze
      # Informational only - warnings do not stop APK
      # --------------------------------------------------
      - name: Flutter analyze
        continue-on-error: true
        run: flutter analyze

      # --------------------------------------------------
      # 10. Build release APK
      # --------------------------------------------------
      - name: Build Release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # 11. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: luxora-stay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

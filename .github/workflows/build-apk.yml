name: Luxora Stay - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luxora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # ----------------------------------------
      # Java 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ----------------------------------------
      # Flutter
      # ----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      # ----------------------------------------
      # Verify Flutter
      # ----------------------------------------
      - name: Verify Flutter
        run: |
          flutter --version
          dart --version
          java -version

      # ----------------------------------------
      # Dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # ----------------------------------------
      # Clean build
      # ----------------------------------------
      - name: Clean project
        run: flutter clean

      - name: Install dependencies again
        run: flutter pub get

      # ----------------------------------------
      # Build APK
      # ----------------------------------------
      - name: Build Release APK
        run: flutter build apk --release

      # ----------------------------------------
      # Verify APK
      # ----------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "=========================================="
          echo "LUXORA STAY APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          ls -lh "$APK"

      # ----------------------------------------
      # Rename APK
      # ----------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/Luxora-Stay-release.apk

      # ----------------------------------------
      # Upload APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luxora-Stay-Release-APK
          path: release/Luxora-Stay-release.apk
          if-no-files-found: error
          retention-days: 30

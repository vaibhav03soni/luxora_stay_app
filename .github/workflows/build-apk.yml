name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      # 4. Verify environment
      - name: Flutter doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # 5. Install Android SDK components
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Get Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 7. Clean previous builds
      - name: Flutter Clean
        run: flutter clean

      # 8. Get dependencies again after clean
      - name: Flutter Pub Get
        run: flutter pub get

      # 9. Build release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 10. Rename APK
      - name: Rename APK
        run: |
          mkdir -p build/apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/apk/Luxora-Stay-release.apk

      # 11. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luxora-Stay-APK
          path: build/apk/Luxora-Stay-release.apk
          if-no-files-found: error
          retention-days: 30
